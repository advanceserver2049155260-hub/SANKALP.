<!doctype html><html lang="hi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0878f9"><link rel="manifest" href="./manifest.json"><link rel="icon" href="./icons/icon-192.png">
<title>SANKALP Web Sling Salary</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#111}
header{background:#0878f9;color:#fff;padding:14px;display:flex;gap:12px;align-items:center}header img{width:48px;height:48px;border-radius:12px}h1{margin:0}
nav{display:flex;background:#fff;position:sticky;top:0;z-index:5}nav button{flex:1;padding:16px;border:0;background:#fff;font-weight:bold;font-size:17px}nav .on{color:#0878f9;border-bottom:4px solid #0878f9}
main{max-width:900px;margin:auto;padding:12px}.card{background:#fff;padding:18px;border-radius:18px;margin-bottom:14px;box-shadow:0 2px 12px #0001}
label{display:block;font-weight:bold;margin:10px 0 5px}input,select{width:100%;padding:13px;border:2px solid #222;border-radius:10px;font-size:17px}.primary{width:100%;padding:14px;margin-top:12px;border:0;border-radius:10px;background:#0878f9;color:#fff;font-weight:bold;font-size:17px}
.rate,.stat{background:#edf5ff;border-radius:12px;padding:14px;text-align:center}.rate{font-size:23px;font-weight:bold;margin-top:10px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat b{display:block;font-size:25px;margin-top:4px}
table{width:100%;border-collapse:collapse}th,td{padding:10px 5px;border-bottom:1px solid #ddd;text-align:left}.datehead td{background:#e7f3ff;color:#075bbd;font-weight:bold;border:0}.amount{font-weight:bold}.hidden{display:none!important}.danger{border:1px solid #c00;background:#fff0f0;color:#b00;padding:5px;border-radius:7px}
</style></head><body>
<header><img src="./logo.webp" onerror="this.src='./icons/icon-192.png'"><div><h1>SANKALP</h1><div>Web Sling Salary</div></div></header>
<nav><button class="on" data-s="work">काम</button><button data-s="rates">Rate List</button><button data-s="history">हिसाब</button></nav>
<main>
<div id="install" class="card hidden"><b>App install:</b> Chrome ⋮ → Install app / Add to Home screen <button id="installBtn" class="primary">Install App</button></div>
<section id="work"><div class="card"><h2>काम जोड़ें</h2><label>तारीख</label><input id="date" type="date"><label>Item</label><select id="item"></select><div id="rate" class="rate">Rate: ₹0</div><label>Quantity</label><input id="qty" type="number" min="1" step="1"><button id="add" class="primary">काम जोड़ें</button></div>
<div class="card"><h2>आज का हिसाब</h2><div class="stats"><div class="stat">Total Qty<b id="tq">0</b></div><div class="stat">आज की कमाई<b id="ts">₹0</b></div></div></div><div class="card"><h2>आज के रिकॉर्ड</h2><div id="today"></div></div></section>
<section id="rates" class="hidden"><div class="card"><h2>Rate List</h2><div id="rl"></div></div><div class="card"><h2>Custom Item</h2><input id="cn" placeholder="Item name"><input id="cr" type="number" min="0" placeholder="Rate ₹"><button id="save" class="primary">Save Item</button></div></section>
<section id="history" class="hidden"><div class="card"><h2>महीने का हिसाब</h2><input id="month" type="month"><div class="stats"><div class="stat">Total Qty<b id="mq">0</b></div><div class="stat">Total Salary<b id="ms">₹0</b></div></div></div><div class="card"><div id="hist"></div></div><div class="card"><button id="backup" class="primary">Backup डाउनलोड</button><input id="restore" type="file" accept=".json"></div></section>
</main><script>
const DEFAULT={items:[{"name": "Tag", "rate": 1}, {"name": "50MM Ring", "rate": 1}, {"name": "75MM Ring", "rate": 2}, {"name": "100MM Ring", "rate": 3}, {"name": "1T × 1M", "rate": 4}, {"name": "1T × 2M", "rate": 5}, {"name": "1T × 3M", "rate": 6}, {"name": "1T × 4M", "rate": 7}, {"name": "1T × 5M", "rate": 8}, {"name": "1T × 6M", "rate": 9}, {"name": "1T × 7M", "rate": 10}, {"name": "1T × 8M", "rate": 11}, {"name": "1T × 9M", "rate": 12}, {"name": "1T × 10M", "rate": 13}, {"name": "2T × 1M", "rate": 6}, {"name": "2T × 2M", "rate": 7}, {"name": "2T × 3M", "rate": 8}, {"name": "2T × 4M", "rate": 9}, {"name": "2T × 5M", "rate": 10}, {"name": "2T × 6M", "rate": 11}, {"name": "2T × 7M", "rate": 12}, {"name": "2T × 8M", "rate": 13}, {"name": "2T × 9M", "rate": 14}, {"name": "2T × 10M", "rate": 15}, {"name": "3T × 1M", "rate": 7}, {"name": "3T × 2M", "rate": 8}, {"name": "3T × 3M", "rate": 9}, {"name": "3T × 4M", "rate": 10}, {"name": "3T × 5M", "rate": 11}, {"name": "3T × 6M", "rate": 12}, {"name": "3T × 7M", "rate": 13}, {"name": "3T × 8M", "rate": 14}, {"name": "3T × 9M", "rate": 15}, {"name": "3T × 10M", "rate": 16}, {"name": "5T × 1M", "rate": 19}, {"name": "5T × 2M", "rate": 20}, {"name": "5T × 3M", "rate": 21}, {"name": "5T × 4M", "rate": 22}, {"name": "5T × 5M", "rate": 23}, {"name": "5T × 6M", "rate": 24}, {"name": "5T × 7M", "rate": 25}, {"name": "5T × 8M", "rate": 26}, {"name": "5T × 9M", "rate": 27}, {"name": "5T × 10M", "rate": 23}, {"name": "6T × 1M", "rate": 15}, {"name": "6T × 2M", "rate": 16}, {"name": "6T × 3M", "rate": 17}, {"name": "6T × 4M", "rate": 18}, {"name": "6T × 5M", "rate": 19}, {"name": "6T × 6M", "rate": 20}, {"name": "6T × 7M", "rate": 21}, {"name": "6T × 8M", "rate": 22}, {"name": "6T × 9M", "rate": 23}, {"name": "6T × 10M", "rate": 24}],records:[]},KEY="SANKALP_FINAL_V2";let db;
try{db=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){db=null}
if(!db||!Array.isArray(db.items)||!Array.isArray(db.records))db=DEFAULT;
const std=Object.fromEntries(DEFAULT.items.map(x=>[x.name,x.rate]));
DEFAULT.items.forEach(x=>{let y=db.items.find(y=>y.name===x.name);if(y)y.rate=x.rate;else db.items.push({...x})});
const money=n=>"₹"+Number(n||0).toLocaleString("en-IN"),today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const getRate=n=>{let x=db.items.find(a=>a.name===n);return x?Number(x.rate)||0:0};
function populate(){let s=document.getElementById("item"),old=s.value;s.innerHTML="";db.items.forEach(x=>{let o=document.createElement("option");o.value=x.name;o.textContent=x.name+" — "+money(x.rate);s.appendChild(o)});if(db.items.some(x=>x.name===old))s.value=old;document.getElementById("rate").textContent="Rate: "+money(getRate(s.value))}
function renderRates(){let h="<table><tr><th>Item</th><th>Rate</th><th></th></tr>";db.items.forEach(x=>{h+="<tr><td>"+esc(x.name)+"</td><td>"+money(x.rate)+"</td><td>"+(std[x.name]===undefined?"<button class=danger onclick='delItem("+JSON.stringify(x.name)+")'>×</button>":"")+"</td></tr>"});document.getElementById("rl").innerHTML=h+"</table>"}
function delItem(n){db.items=db.items.filter(x=>x.name!==n);save();render()}
function renderToday(){let d=document.getElementById("date").value||today(),r=db.records.filter(x=>x.date===d),q=0,s=0;r.forEach(x=>{q+=x.qty;s+=x.qty*x.rate});document.getElementById("tq").textContent=q;document.getElementById("ts").textContent=money(s);let h=r.length?"<table><tr><th>Item</th><th>Qty</th><th>Amount</th><th></th></tr>":"<p>कोई record नहीं</p>";r.forEach(x=>{let i=db.records.indexOf(x);h+="<tr><td>"+esc(x.item)+"</td><td>"+x.qty+"</td><td class=amount>"+money(x.qty*x.rate)+"</td><td><button class=danger onclick='removeRec("+i+")'>×</button></td></tr>"});document.getElementById("today").innerHTML=r.length?h+"</table>":h}
function removeRec(i){db.records.splice(i,1);save();render()}
function renderHistory(){let m=document.getElementById("month").value||today().slice(0,7),r=db.records.filter(x=>x.date.startsWith(m)).sort((a,b)=>a.date.localeCompare(b.date));let q=0,s=0;r.forEach(x=>{q+=x.qty;s+=x.qty*x.rate});document.getElementById("mq").textContent=q;document.getElementById("ms").textContent=money(s);let h=r.length?"<table><tr><th>Date</th><th>Item</th><th>Qty</th><th>Amount</th></tr>":"<p>इस महीने कोई record नहीं</p>",last="";r.forEach(x=>{if(x.date!==last){h+="<tr class=datehead><td colspan=4>"+x.date+"</td></tr>";last=x.date}h+="<tr><td></td><td>"+esc(x.item)+"</td><td>"+x.qty+"</td><td class=amount>"+money(x.qty*x.rate)+"</td></tr>"});document.getElementById("hist").innerHTML=r.length?h+"</table>":h}
function render(){populate();renderRates();renderToday();renderHistory();save()}
document.getElementById("date").value=today();document.getElementById("month").value=today().slice(0,7);
document.getElementById("item").onchange=()=>document.getElementById("rate").textContent="Rate: "+money(getRate(document.getElementById("item").value));
document.getElementById("date").onchange=renderToday;document.getElementById("month").onchange=renderHistory;
document.getElementById("add").onclick=()=>{let date=document.getElementById("date").value,item=document.getElementById("item").value,qty=Number(document.getElementById("qty").value);if(!date||!item||qty<=0)return alert("सही तारीख, item और quantity भरें");db.records.push({date,item,qty,rate:getRate(item)});document.getElementById("qty").value="";render()};
document.getElementById("save").onclick=()=>{let n=document.getElementById("cn").value.trim(),r=Number(document.getElementById("cr").value);if(!n||!Number.isFinite(r)||r<0)return alert("Item और rate भरें");let x=db.items.find(a=>a.name===n);if(x)x.rate=r;else db.items.push({name:n,rate:r});document.getElementById("cn").value="";document.getElementById("cr").value="";render()};
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on"));b.classList.add("on");["work","rates","history"].forEach(id=>document.getElementById(id).classList.toggle("hidden",id!==b.dataset.s))});
document.getElementById("backup").onclick=()=>{let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));a.download="SANKALP-backup.json";a.click()};
document.getElementById("restore").onchange=e=>{let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{db=JSON.parse(rd.result);save();render();alert("Backup restored")}catch(_){alert("Backup गलत है")}};rd.readAsText(f)};
let dp=null;addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;document.getElementById("install").classList.remove("hidden")});document.getElementById("installBtn").onclick=async()=>{if(dp){dp.prompt();await dp.userChoice;dp=null}};
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");render();
</script></body></html>
